name: Fetch France Culture critiques

on:
  schedule:
    - cron: '30 6 * * *'   # daily at 06:30 UTC (30 min after La Terrasse)
  workflow_dispatch:        # allow manual trigger from the Actions tab

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Les Midis de Culture critiques
        run: python scripts/fetch_france_culture.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/critics/france_culture.json
          git diff --cached --quiet || git commit -m "chore: update France Culture feed [skip ci]"
          git push
