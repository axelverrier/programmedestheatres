<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Programme des théâtres à Paris (et alentours)</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎭</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="header-inner">
      <div>
        <h1>Pièces de théâtre</h1>
        <p class="subtitle">Paris et IDF · Saison 2026–2027</p>
      </div>
      <nav class="tab-switcher">
        <a href="index.html" class="tab-opt active">Programme</a>
        <a href="critiques.html" class="tab-opt">Critiques</a>
      </nav>
    </div>
  </header>

  <div class="controls" id="controls">
    <div class="controls-topbar">
      <button class="filters-toggle" id="filtersToggle">Filtres ▾</button>
    </div>
    <div class="filter-groups" id="filterGroups">
      <div class="filter-group">
        <span class="filter-label">Type :</span>
        <div class="filters" id="typeFilters"></div>
      </div>
      <div class="control-sep"></div>
      <div class="filter-group">
        <span class="filter-label">Statut :</span>
        <div class="filters" id="statusFilters"></div>
      </div>
      <div class="control-sep"></div>
      <div class="filter-group">
        <span class="filter-label">Zone :</span>
        <div class="filters" id="regionFilters"></div>
      </div>
      <div class="control-sep"></div>
      <button class="vision-btn" id="editorsPickBtn">✦ J'ai la vision</button>
    </div><!-- /.filter-groups -->
  </div><!-- /.controls -->

  <div class="timeline-scroll-container" id="scrollContainer">
    <div class="timeline-wrapper" id="timeline"></div>
  </div>

  <div id="tooltip" class="tooltip"></div>

  <div class="scroll-mirror" id="scrollMirror">
    <div id="scrollMirrorInner"></div>
  </div>

  <footer>
    <p> Ceci est un projet personnel et bénévole, par un spectateur enthousiaste. Il est librement inspiré de www.programmedesexpos.paris.</p>
<p> * (programmation incomplète pour l'instant) </p>
  </footer>

  <button class="today-btn today-btn-fab">Aujourd'hui</button>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
