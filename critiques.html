<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Critiques — Programme des théâtres</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎭</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="header-inner">
      <div>
        <h1>🎭 Programme des Théâtres de Paris (et alentours)</h1>
        <p class="subtitle">Saison 2025–2026</p>
      </div>
      <nav class="tab-switcher">
        <a href="index.html" class="tab-opt">Programme</a>
        <a href="critiques.html" class="tab-opt active">Critiques</a>
      </nav>
    </div>
  </header>

  <div class="page-content">
    <h2 class="page-title">Critiques</h2>
    <p class="page-subtitle">
      Critiques de <a href="https://www.journal-laterrasse.fr/theatre/type/critique/" target="_blank" rel="noopener" style="color:inherit;">La Terrasse</a>
      et de <a href="https://www.radiofrance.fr/franceculture/podcasts/les-midis-de-culture" target="_blank" rel="noopener" style="color:inherit;">Les Midis de Culture</a>
      pour les pièces actuellement à l'affiche
    </p>

    <ul class="critics-list" id="criticsList">
      <li style="color:var(--muted);font-size:.85rem;padding:14px 0;">Chargement…</li>
    </ul>

    <p class="critics-meta" id="criticsMeta"></p>
  </div>

  <script>
    function truncate(str, n) {
      return str.length > n ? str.slice(0, n).trimEnd() + "…" : str;
    }

    const SOURCE_LABELS = {
      terrasse:       "La Terrasse",
      france_culture: "Les Midis de Culture",
    };

    Promise.all([
      fetch("data/critics/laterrasse.json").then(r => r.json()),
      fetch("data/critics/france_culture.json").then(r => r.json()).catch(() => ({ matches: [] })),
    ])
      .then(([terrasse, fc]) => {
        const list = document.getElementById("criticsList");
        const meta = document.getElementById("criticsMeta");

        const all = [
          ...(terrasse.matches || []).map(m => ({ ...m, source: "terrasse" })),
          ...(fc.matches || []).map(m => ({ ...m, source: "france_culture" })),
        ].sort((a, b) => a.play_title.localeCompare(b.play_title, "fr"));

        if (all.length === 0) {
          list.innerHTML = '<li style="color:var(--muted);font-size:.85rem;padding:14px 0;">Aucune critique trouvée pour les pièces actuellement à l\'affiche.</li>';
        } else {
          list.innerHTML = all.map(m => `
            <li>
              <a class="critics-play-link" href="${m.article_url}" target="_blank" rel="noopener">${m.play_title}</a>
              <span class="critics-theatre">${m.theatre}${m.director ? " · " + m.director : ""}</span>
              <span class="critics-headline">${truncate(m.article_title, 110)}</span>
              <span class="critics-source">${SOURCE_LABELS[m.source] || m.source}</span>
            </li>`).join("");
        }

        const dates = [terrasse.updated, fc.updated].filter(Boolean).sort();
        meta.textContent = dates.length ? `Mis à jour le ${dates[dates.length - 1]}` : "";
      })
      .catch(() => {
        document.getElementById("criticsList").innerHTML =
          '<li style="color:var(--muted);font-size:.85rem;padding:14px 0;">Impossible de charger les critiques.</li>';
      });
  </script>

</body>
</html>
